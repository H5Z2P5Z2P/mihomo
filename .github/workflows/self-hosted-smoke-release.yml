name: Self-Hosted Smoke Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: true

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  smoke-release:
    permissions: write-all
    runs-on: ${{ fromJSON('["self-hosted","Linux","X64","mihomo-local"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Build linux amd64 smoke artifact
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v3
          GOTOOLCHAIN: local
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          BUILDTIME="$(date)"
          go build -v -tags "with_gvisor" -trimpath -ldflags "-extldflags --static -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="
          cp mihomo "mihomo-linux-amd64-smoke"
          gzip -c "mihomo-linux-amd64-smoke" > "mihomo-linux-amd64-smoke-${VERSION}.gz"
          sha256sum "mihomo-linux-amd64-smoke-${VERSION}.gz" > checksums.txt

      - name: Tag commit
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          VERSION="${{ github.event.inputs.version }}"
          if git rev-parse "${VERSION}^{commit}" >/dev/null 2>&1; then
            if [ "$(git rev-parse "${VERSION}^{commit}")" != "${GITHUB_SHA}" ]; then
              echo "tag ${VERSION} already exists on another commit" >&2
              exit 1
            fi
          else
            git tag "${VERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/${VERSION}"
          fi

      - name: Upload Smoke Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }} self-hosted smoke
          body: Self-hosted runner smoke release for linux amd64.
          prerelease: true
          files: |
            mihomo-linux-amd64-smoke-${{ github.event.inputs.version }}.gz
            checksums.txt
